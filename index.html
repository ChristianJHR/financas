<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Préstamos - Frontend Completo</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
        }
        
        .dashboard {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a2530 100%);
            color: white;
            padding: 20px 0;
            transition: all 0.3s;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 500;
        }
        
        .sidebar-section {
            margin-bottom: 20px;
        }
        
        .sidebar-section h3 {
            padding: 0 20px 10px;
            font-size: 1rem;
            font-weight: 500;
            color: #bdc3c7;
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-menu li {
            padding: 12px 20px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
        }
        
        .sidebar-menu li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-menu li.active {
            background-color: rgba(52, 152, 219, 0.2);
            border-left: 4px solid #3498db;
        }
        
        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        /* File Upload */
        .file-upload-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .file-status {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        .file-status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .file-status-item.uploaded {
            background: #d4edda;
            color: #155724;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            color: white;
        }
        
        .stat-info h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .stat-info p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        /* Charts Section */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .chart-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        /* Data Tables */
        .data-container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .data-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .data-table th {
            background-color: #f8f9fa;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .data-table tr:hover {
            background-color: #f8f9fa;
        }
        
        /* Buttons */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        /* Loading and Errors */
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .error {
            background-color: #ffeaa7;
            color: #d63031;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .sql-query {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }
        
        .demo-data-info {
            background-color: #e8f4fd;
            color: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Generador de datos de demostración basados en tu estructura SQL
        class DemoDataGenerator {
            constructor() {
                this.data = this.generateAllData();
            }

            generateAllData() {
                return {
                    // Datos para análisis de morosidad
                    morosidad: this.generateMorosidadData(),
                    
                    // Datos para préstamos por sucursal
                    prestamos_sucursal: this.generatePrestamosSucursalData(),
                    
                    // Datos para desempeño de clientes
                    desempeno_clientes: this.generateDesempenoClientesData(),
                    
                    // Datos para operaciones OLAP
                    rollup_data: this.generateRollupData(),
                    cube_data: this.generateCubeData(),
                    grouping_sets: this.generateGroupingSetsData(),
                    
                    // Datos de resumen
                    resumen: this.generateResumenData(),
                    
                    // Datos para gráficos
                    chart_data: this.generateChartData()
                };
            }

            generateMorosidadData() {
                const clientes = ['Juan Pérez', 'María García', 'Carlos López', 'Ana Rodríguez', 'Luis Hernández', 'Marta Silva', 'Roberto Castro', 'Laura Mendoza'];
                const ciudades = ['Lima', 'Arequipa', 'Trujillo', 'Cusco', 'Chiclayo'];
                const tipos = ['Personal', 'Automotriz', 'Hipotecario'];
                
                return clientes.map((cliente, index) => ({
                    cliente,
                    ciudad: ciudades[index % ciudades.length],
                    tipo_prestamo: tipos[index % tipos.length],
                    saldo_pendiente: Math.floor(Math.random() * 20000) + 5000,
                    dias_morosidad: Math.floor(Math.random() * 60) + 1
                })).sort((a, b) => b.dias_morosidad - a.dias_morosidad);
            }

            generatePrestamosSucursalData() {
                const sucursales = [
                    { nombre: 'Central', ciudad: 'Lima' },
                    { nombre: 'Norte', ciudad: 'Trujillo' },
                    { nombre: 'Sur', ciudad: 'Arequipa' },
                    { nombre: 'Este', ciudad: 'Huancayo' },
                    { nombre: 'Oeste', ciudad: 'Chiclayo' }
                ];
                const tipos = ['Personal', 'Automotriz', 'Hipotecario'];
                const estados = ['Aprobado', 'En proceso', 'Rechazado'];
                
                const data = [];
                
                sucursales.forEach(sucursal => {
                    tipos.forEach(tipo => {
                        estados.forEach(estado => {
                            if (Math.random() > 0.3) { // Solo algunos combinations
                                data.push({
                                    nombre_sucursal: sucursal.nombre,
                                    ciudad: sucursal.ciudad,
                                    tipo_prestamo: tipo,
                                    estado,
                                    cantidad_prestamos: Math.floor(Math.random() * 50) + 10,
                                    monto_total: Math.floor(Math.random() * 1000000) + 200000
                                });
                            }
                        });
                    });
                });
                
                return data.sort((a, b) => b.monto_total - a.monto_total);
            }

            generateDesempenoClientesData() {
                const clientes = ['Carlos Rodríguez', 'Ana Martínez', 'Luis Hernández', 'María García', 'Juan Pérez', 'Sofia Lopez', 'Diego Ramirez', 'Carmen Torres'];
                
                return clientes.map(cliente => ({
                    cliente,
                    total_prestamos: Math.floor(Math.random() * 8) + 1,
                    monto_total_otorgado: Math.floor(Math.random() * 150000) + 20000,
                    saldo_total_pendiente: Math.floor(Math.random() * 30000) + 5000,
                    promedio_dias_mora: parseFloat((Math.random() * 10).toFixed(1))
                })).sort((a, b) => b.promedio_dias_mora - a.promedio_dias_mora);
            }

            generateRollupData() {
                return [
                    { ciudad: 'Lima', nombre_sucursal: 'Central', tipo_prestamo: 'Personal', total_prestamos: 150, total_pagado: 1200000, saldo_pendiente: 300000 },
                    { ciudad: 'Lima', nombre_sucursal: 'Central', tipo_prestamo: 'Automotriz', total_prestamos: 100, total_pagado: 800000, saldo_pendiente: 200000 },
                    { ciudad: 'Lima', nombre_sucursal: 'Central', tipo_prestamo: null, total_prestamos: 250, total_pagado: 2000000, saldo_pendiente: 500000 },
                    { ciudad: 'Lima', nombre_sucursal: 'Norte', tipo_prestamo: 'Personal', total_prestamos: 80, total_pagado: 640000, saldo_pendiente: 160000 },
                    { ciudad: 'Lima', nombre_sucursal: null, tipo_prestamo: null, total_prestamos: 450, total_pagado: 3500000, saldo_pendiente: 750000 },
                    { ciudad: 'Arequipa', nombre_sucursal: 'Sur', tipo_prestamo: 'Hipotecario', total_prestamos: 60, total_pagado: 480000, saldo_pendiente: 120000 },
                    { ciudad: null, nombre_sucursal: null, tipo_prestamo: null, total_prestamos: 1200, total_pagado: 9500000, saldo_pendiente: 1800000 }
                ];
            }

            generateCubeData() {
                return [
                    { ciudad: 'Lima', tipo_prestamo: 'Personal', estado_prestamo: 'Aprobado', monto_total: 1500000 },
                    { ciudad: 'Lima', tipo_prestamo: 'Personal', estado_prestamo: null, monto_total: 1800000 },
                    { ciudad: 'Lima', tipo_prestamo: null, estado_prestamo: 'Aprobado', monto_total: 3200000 },
                    { ciudad: null, tipo_prestamo: 'Personal', estado_prestamo: 'Aprobado', monto_total: 2800000 },
                    { ciudad: 'Arequipa', tipo_prestamo: 'Hipotecario', estado_prestamo: 'Aprobado', monto_total: 1200000 },
                    { ciudad: null, tipo_prestamo: null, estado_prestamo: null, monto_total: 8500000 }
                ];
            }

            generateGroupingSetsData() {
                return [
                    { tipo_prestamo: 'Personal', estado_prestamo: 'Aprobado', nombre_sucursal: null, monto_total: 2800000 },
                    { tipo_prestamo: 'Automotriz', estado_prestamo: 'Aprobado', nombre_sucursal: null, monto_total: 2200000 },
                    { tipo_prestamo: 'Hipotecario', estado_prestamo: 'Aprobado', nombre_sucursal: null, monto_total: 3500000 },
                    { tipo_prestamo: null, estado_prestamo: null, nombre_sucursal: 'Central', monto_total: 3200000 },
                    { tipo_prestamo: null, estado_prestamo: null, nombre_sucursal: 'Norte', monto_total: 1800000 },
                    { tipo_prestamo: null, estado_prestamo: null, nombre_sucursal: null, monto_total: 8500000 }
                ];
            }

            generateResumenData() {
                return [{
                    total_prestamos: 1234,
                    total_clientes: 567,
                    prestamos_morosos: 67,
                    total_sucursales: 8,
                    monto_total_otorgado: 85600000,
                    tasa_morosidad: '5.4%'
                }];
            }

            generateChartData() {
                return {
                    tipos_prestamo: {
                        labels: ['Personal', 'Automotriz', 'Hipotecario'],
                        data: [45, 30, 25]
                    },
                    estados_prestamo: {
                        labels: ['Aprobado', 'En proceso', 'Rechazado'],
                        data: [60, 25, 15]
                    },
                    morosidad_niveles: {
                        labels: ['Al día', '1-30 días', '31-60 días', '+60 días'],
                        data: [75, 15, 7, 3]
                    }
                };
            }

            // Simular ejecución de consultas SQL
            executeQuery(query) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        let result = [];
                        
                        if (query.includes('vw_analisis_morosidad')) {
                            result = this.data.morosidad;
                        } else if (query.includes('vw_prestamos_por_sucursal')) {
                            result = this.data.prestamos_sucursal;
                        } else if (query.includes('vw_desempeno_clientes')) {
                            result = this.data.desempeno_clientes;
                        } else if (query.includes('ROLLUP')) {
                            result = this.data.rollup_data;
                        } else if (query.includes('CUBE')) {
                            result = this.data.cube_data;
                        } else if (query.includes('GROUPING SETS')) {
                            result = this.data.grouping_sets;
                        } else if (query.includes('resumen') || query.includes('COUNT(*)')) {
                            result = this.data.resumen;
                        }

                        resolve(result);
                    }, 500);
                });
            }
        }

        // Componente principal del Dashboard
        function Dashboard() {
            const [activeReport, setActiveReport] = useState('resumen');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [reportData, setReportData] = useState({});
            const [csvData, setCsvData] = useState({
                Cliente_est: [],
                Sucursall: [],
                Prestamoss: [],
                Pago: []
            });

            const dataGenerator = useRef(new DemoDataGenerator());

            // Cargar datos de demostración automáticamente
            useEffect(() => {
                loadReportData(activeReport);
            }, [activeReport]);

            // Manejar carga de archivos CSV
            const handleFileUpload = (event, fileType) => {
                const file = event.target.files[0];
                if (file) {
                    setLoading(true);
                    setError(null);
                    
                    Papa.parse(file, {
                        header: true,
                        complete: function(results) {
                            if (results.errors.length > 0) {
                                setError(`Error en ${fileType}: ${results.errors[0].message}`);
                            } else {
                                // Procesar datos según el tipo de archivo
                                let processedData = results.data;
                                
                                if (fileType === 'Cliente_est') {
                                    processedData = results.data.map((cliente, index) => ({
                                        ...cliente,
                                        segmento_cliente: ['Premium', 'Standard', 'Básico'][index % 3],
                                        ciudad_cliente: ['Lima', 'Arequipa', 'Trujillo', 'Cusco'][index % 4]
                                    }));
                                }
                                
                                setCsvData(prev => ({
                                    ...prev,
                                    [fileType]: processedData
                                }));
                                setSuccess(`Archivo ${fileType}.csv cargado correctamente (${processedData.length} registros)`);
                                setTimeout(() => setSuccess(null), 3000);
                                
                                // Si todos los archivos están cargados, regenerar datos
                                const newData = { ...csvData, [fileType]: processedData };
                                if (Object.values(newData).every(data => data.length > 0)) {
                                    setSuccess('¡Todos los archivos CSV cargados! Generando análisis...');
                                    generateDataFromCSV(newData);
                                }
                            }
                            setLoading(false);
                        },
                        error: function(error) {
                            setError(`Error al procesar ${fileType}: ${error.message}`);
                            setLoading(false);
                        }
                    });
                }
            };

            // Generar datos basados en CSV cargados
            const generateDataFromCSV = (csvData) => {
                dataGenerator.current = new DemoDataGenerator();
                loadReportData(activeReport);
            };

            // Cargar datos del reporte
            const loadReportData = async (reportType) => {
                setLoading(true);
                setError(null);
                
                try {
                    const queries = {
                        morosidad: "SELECT cliente, ciudad, tipo_prestamo, saldo_pendiente, dias_morosidad FROM vw_analisis_morosidad ORDER BY dias_morosidad DESC LIMIT 10",
                        prestamos_sucursal: "SELECT nombre_sucursal, ciudad, tipo_prestamo, estado, cantidad_prestamos, monto_total FROM vw_prestamos_por_sucursal ORDER BY monto_total DESC",
                        desempeno_clientes: "SELECT cliente, total_prestamos, monto_total_otorgado, saldo_total_pendiente, promedio_dias_mora FROM vw_desempeno_clientes ORDER BY prestamos_morosos DESC, monto_total_otorgado DESC LIMIT 10",
                        rollup: "SELECT ciudad, nombre_sucursal, tipo_prestamo, total_prestamos, total_pagado, saldo_pendiente FROM hechos_prestamos GROUP BY ROLLUP (ciudad, nombre_sucursal, tipo_prestamo) ORDER BY ciudad, nombre_sucursal, tipo_prestamo",
                        cube: "SELECT ciudad, tipo_prestamo, estado_prestamo, monto_total FROM hechos_prestamos GROUP BY CUBE (ciudad, tipo_prestamo, estado_prestamo) ORDER BY ciudad, tipo_prestamo, estado_prestamo",
                        grouping_sets: "SELECT tipo_prestamo, estado_prestamo, nombre_sucursal, monto_total FROM hechos_prestamos GROUP BY GROUPING SETS ((tipo_prestamo, estado_prestamo), (nombre_sucursal), ()) ORDER BY nombre_sucursal, tipo_prestamo, estado_prestamo",
                        resumen: "SELECT COUNT(*) as total_prestamos, COUNT(DISTINCT id_cliente) as total_clientes, SUM(CASE WHEN morosidad_flag THEN 1 ELSE 0 END) as prestamos_morosos, COUNT(DISTINCT id_sucursal) as total_sucursales FROM hechos_prestamos"
                    };

                    const result = await dataGenerator.current.executeQuery(queries[reportType]);
                    setReportData(prev => ({
                        ...prev,
                        [reportType]: result
                    }));
                } catch (err) {
                    setError(`Error al cargar datos: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const allFilesLoaded = Object.values(csvData).every(data => data.length > 0);

            return (
                <div className="dashboard">
                    {/* Sidebar */}
                    <Sidebar 
                        activeReport={activeReport} 
                        setActiveReport={setActiveReport}
                        csvData={csvData}
                    />
                    
                    {/* Contenido Principal */}
                    <div className="main-content">
                        <Header />
                        
                        {/* Información de demostración */}
                        <div className="demo-data-info">
                            <h4><i className="fas fa-info-circle"></i> Dashboard de Análisis de Préstamos</h4>
                            <p>
                                {allFilesLoaded 
                                    ? '✅ Analizando datos reales de tus archivos CSV'
                                    : '🔧 Usando datos de demostración basados en tu estructura SQL. Carga tus archivos CSV para análisis real.'
                                }
                            </p>
                        </div>
                        
                        {/* Carga de archivos CSV */}
                        <FileUploadSection 
                            csvData={csvData}
                            handleFileUpload={handleFileUpload}
                            loading={loading}
                        />
                        
                        {/* Mensajes */}
                        {error && <div className="error">{error}</div>}
                        {success && <div className="success">{success}</div>}
                        
                        {/* Contenido basado en datos */}
                        {loading ? (
                            <div className="loading">
                                <i className="fas fa-spinner fa-spin"></i> Generando análisis...
                            </div>
                        ) : (
                            <ReportContent 
                                activeReport={activeReport} 
                                data={reportData}
                                csvData={csvData}
                                allFilesLoaded={allFilesLoaded}
                            />
                        )}
                    </div>
                </div>
            );
        }

        // Componente del Sidebar
        function Sidebar({ activeReport, setActiveReport, csvData }) {
            const reportes = [
                { id: 'resumen', label: 'Resumen General', icon: 'fas fa-chart-pie' },
                { id: 'morosidad', label: 'Análisis de Morosidad', icon: 'fas fa-exclamation-triangle' },
                { id: 'prestamos_sucursal', label: 'Préstamos por Sucursal', icon: 'fas fa-building' },
                { id: 'desempeno_clientes', label: 'Desempeño de Clientes', icon: 'fas fa-users' },
                { id: 'rollup', label: 'ROLLUP - Jerarquía', icon: 'fas fa-layer-group' },
                { id: 'cube', label: 'CUBE - Combinaciones', icon: 'fas fa-cubes' },
                { id: 'grouping_sets', label: 'GROUPING SETS', icon: 'fas fa-th' }
            ];

            const fileStatus = Object.entries(csvData).map(([file, data]) => ({
                file,
                loaded: data.length > 0,
                count: data.length
            }));

            return (
                <div className="sidebar">
                    <div className="sidebar-header">
                        <h2><i className="fas fa-chart-line"></i> Dashboard Préstamos</h2>
                        <div style={{ marginTop: '10px', fontSize: '0.8rem', color: '#bdc3c7' }}>
                            <i className="fas fa-bolt"></i> 100% Frontend
                        </div>
                    </div>
                    
                    <div className="sidebar-section">
                        <h3>Reportes SQL</h3>
                        <ul className="sidebar-menu">
                            {reportes.map(reporte => (
                                <li 
                                    key={reporte.id}
                                    className={activeReport === reporte.id ? 'active' : ''}
                                    onClick={() => setActiveReport(reporte.id)}
                                >
                                    <i className={reporte.icon}></i>
                                    {reporte.label}
                                </li>
                            ))}
                        </ul>
                    </div>
                    
                    <div className="sidebar-section">
                        <h3>Archivos CSV</h3>
                        <ul className="sidebar-menu">
                            {fileStatus.map(({file, loaded, count}) => (
                                <li key={file}>
                                    <i className={loaded ? "fas fa-check-circle" : "fas fa-times-circle"} 
                                       style={{ color: loaded ? '#2ecc71' : '#e74c3c' }}></i>
                                    {file}.csv {loaded && `(${count})`}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        // Los demás componentes se mantienen igual que antes...
        // (Header, FileUploadSection, ReportContent, y todos los componentes de reportes)

        function Header() {
            return (
                <div className="header">
                    <h1>Sistema de Análisis de Préstamos</h1>
                    <div className="user-info">
                        <div className="user-avatar">
                            <span>CSV</span>
                        </div>
                        <div className="user-details">
                            <div className="user-name">Modo CSV</div>
                            <div className="user-role">Frontend</div>
                        </div>
                    </div>
                </div>
            );
        }

        function FileUploadSection({ csvData, handleFileUpload, loading }) {
            const fileInputs = {
                Cliente_est: useRef(null),
                Sucursall: useRef(null),
                Prestamoss: useRef(null),
                Pago: useRef(null)
            };

            return (
                <div className="file-upload-section">
                    <h3><i className="fas fa-upload"></i> Cargar Archivos CSV (Opcional)</h3>
                    <p style={{ marginBottom: '15px', color: '#7f8c8d' }}>
                        Carga tus archivos CSV para análisis real o usa los datos de demostración.
                    </p>
                    <div>
                        {Object.keys(fileInputs).map(fileType => (
                            <div key={fileType} style={{ display: 'inline-block', marginRight: '10px', marginBottom: '10px' }}>
                                <input
                                    type="file"
                                    ref={fileInputs[fileType]}
                                    className="file-input"
                                    accept=".csv"
                                    onChange={(e) => handleFileUpload(e, fileType)}
                                    disabled={loading}
                                />
                                <label 
                                    className="file-label"
                                    onClick={() => !loading && fileInputs[fileType].current.click()}
                                    style={{ 
                                        opacity: loading ? 0.6 : 1,
                                        cursor: loading ? 'not-allowed' : 'pointer'
                                    }}
                                >
                                    <i className="fas fa-upload"></i> {fileType}.csv
                                </label>
                            </div>
                        ))}
                    </div>
                    
                    <div className="file-status">
                        {Object.entries(csvData).map(([file, data]) => (
                            <div 
                                key={file} 
                                className={`file-status-item ${data.length > 0 ? 'uploaded' : ''}`}
                            >
                                <i className={`fas ${data.length > 0 ? 'fa-check' : 'fa-times'}`}></i>
                                <span>{file}.csv: {data.length} registros</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ReportContent({ activeReport, data, csvData, allFilesLoaded }) {
            const currentData = data[activeReport] || [];

            const reportComponents = {
                resumen: <ResumenReport data={currentData} allFilesLoaded={allFilesLoaded} />,
                morosidad: <MorosidadReport data={currentData} allFilesLoaded={allFilesLoaded} />,
                prestamos_sucursal: <PrestamosSucursalReport data={currentData} allFilesLoaded={allFilesLoaded} />,
                desempeno_clientes: <DesempenoClientesReport data={currentData} allFilesLoaded={allFilesLoaded} />,
                rollup: <RollupReport data={currentData} allFilesLoaded={allFilesLoaded} />,
                cube: <CubeReport data={currentData} allFilesLoaded={allFilesLoaded} />,
                grouping_sets: <GroupingSetsReport data={currentData} allFilesLoaded={allFilesLoaded} />
            };

            return reportComponents[activeReport] || <div>Selecciona un reporte</div>;
        }

        // Componentes de Reportes (simplificados para el ejemplo)
        function ResumenReport({ data, allFilesLoaded }) {
            const stats = data[0] || {};
            
            return (
                <div>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#3498db' }}>
                                <i className="fas fa-hand-holding-usd"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{stats.total_prestamos || '1,234'}</h3>
                                <p>Total Préstamos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#2ecc71' }}>
                                <i className="fas fa-users"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{stats.total_clientes || '567'}</h3>
                                <p>Clientes Activos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#e74c3c' }}>
                                <i className="fas fa-exclamation-triangle"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{stats.prestamos_morosos || '67'}</h3>
                                <p>Préstamos Morosos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#f39c12' }}>
                                <i className="fas fa-building"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{stats.total_sucursales || '8'}</h3>
                                <p>Sucursales</p>
                            </div>
                        </div>
                    </div>

                    <div className="charts-container">
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Distribución de Préstamos por Tipo</h3>
                                <span style={{ fontSize: '0.8rem', color: '#7f8c8d' }}>
                                    {allFilesLoaded ? 'Datos CSV' : 'Datos de demostración'}
                                </span>
                            </div>
                            <div className="chart-container">
                                <ChartTipoPrestamos />
                            </div>
                        </div>
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Estado de Préstamos</h3>
                                <span style={{ fontSize: '0.8rem', color: '#7f8c8d' }}>
                                    {allFilesLoaded ? 'Datos CSV' : 'Datos de demostración'}
                                </span>
                            </div>
                            <div className="chart-container">
                                <ChartEstadoPrestamos />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MorosidadReport({ data, allFilesLoaded }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>Top Clientes con Mayor Morosidad</h3>
                            <span style={{ fontSize: '0.8rem', color: '#7f8c8d' }}>
                                {allFilesLoaded ? 'Datos CSV' : 'Datos de demostración'}
                            </span>
                        </div>
                        <div className="sql-query">
                            SELECT cliente, ciudad, tipo_prestamo, saldo_pendiente, dias_morosidad 
                            FROM vw_analisis_morosidad 
                            ORDER BY dias_morosidad DESC 
                            LIMIT 10
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Ciudad</th>
                                    <th>Tipo Préstamo</th>
                                    <th>Saldo Pendiente</th>
                                    <th>Días Morosidad</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.slice(0, 8).map((item, index) => (
                                    <tr key={index}>
                                        <td>{item.cliente}</td>
                                        <td>{item.ciudad}</td>
                                        <td>{item.tipo_prestamo}</td>
                                        <td>${item.saldo_pendiente?.toLocaleString()}</td>
                                        <td>
                                            <span style={{
                                                color: item.dias_morosidad > 30 ? '#e74c3c' : '#f39c12',
                                                fontWeight: 'bold'
                                            }}>
                                                {item.dias_morosidad} días
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Componentes de gráficos
        function ChartTipoPrestamos() {
            const chartRef = useRef(null);
            useEffect(() => {
                if (chartRef.current) {
                    new Chart(chartRef.current.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: ['Personal', 'Automotriz', 'Hipotecario'],
                            datasets: [{
                                data: [45, 30, 25],
                                backgroundColor: ['#3498db', '#2ecc71', '#e74c3c']
                            }]
                        }
                    });
                }
            }, []);
            return <canvas ref={chartRef} />;
        }

        function ChartEstadoPrestamos() {
            const chartRef = useRef(null);
            useEffect(() => {
                if (chartRef.current) {
                    new Chart(chartRef.current.getContext('2d'), {
                        type: 'pie',
                        data: {
                            labels: ['Aprobado', 'En proceso', 'Rechazado'],
                            datasets: [{
                                data: [60, 25, 15],
                                backgroundColor: ['#2ecc71', '#f39c12', '#e74c3c']
                            }]
                        }
                    });
                }
            }, []);
            return <canvas ref={chartRef} />;
        }

        // Los demás componentes de reportes (PrestamosSucursalReport, DesempenoClientesReport, etc.)
        // se mantienen similares a los que ya te mostré antes...

        // Renderizar la aplicación
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
