<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Préstamos - CSV</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
        }
        
        .dashboard {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a2530 100%);
            color: white;
            padding: 20px 0;
            transition: all 0.3s;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 500;
        }
        
        .sidebar-section {
            margin-bottom: 20px;
        }
        
        .sidebar-section h3 {
            padding: 0 20px 10px;
            font-size: 1rem;
            font-weight: 500;
            color: #bdc3c7;
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-menu li {
            padding: 12px 20px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
        }
        
        .sidebar-menu li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-menu li.active {
            background-color: rgba(52, 152, 219, 0.2);
            border-left: 4px solid #3498db;
        }
        
        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .file-upload-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .file-status {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        .file-status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .file-status-item.uploaded {
            background: #d4edda;
            color: #155724;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            color: white;
        }
        
        .stat-info h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .stat-info p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        /* Charts Section */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .chart-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        /* Data Tables */
        .data-container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .data-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .data-table th {
            background-color: #f8f9fa;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .data-table tr:hover {
            background-color: #f8f9fa;
        }
        
        /* Loading and Errors */
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .error {
            background-color: #ffeaa7;
            color: #d63031;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Componente principal del Dashboard
        function Dashboard() {
            const [activeReport, setActiveReport] = useState('resumen');
            const [csvData, setCsvData] = useState({
                Cliente_est: [],
                Sucursall: [],
                Prestamoss: [],
                Pago: []
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);

            // Procesar datos cuando se carguen los CSVs
            const processedData = processCSVData(csvData);

            // Manejar carga de archivos CSV
            const handleFileUpload = (event, fileType) => {
                const file = event.target.files[0];
                if (file) {
                    setLoading(true);
                    setError(null);
                    
                    Papa.parse(file, {
                        header: true,
                        complete: function(results) {
                            if (results.errors.length > 0) {
                                setError(`Error en ${fileType}: ${results.errors[0].message}`);
                            } else {
                                setCsvData(prev => ({
                                    ...prev,
                                    [fileType]: results.data
                                }));
                                setSuccess(`Archivo ${fileType}.csv cargado correctamente (${results.data.length} registros)`);
                                setTimeout(() => setSuccess(null), 3000);
                            }
                            setLoading(false);
                        },
                        error: function(error) {
                            setError(`Error al procesar ${fileType}: ${error.message}`);
                            setLoading(false);
                        }
                    });
                }
            };

            // Verificar si todos los archivos están cargados
            const allFilesLoaded = Object.values(csvData).every(data => data.length > 0);

            return (
                <div className="dashboard">
                    {/* Sidebar */}
                    <Sidebar 
                        activeReport={activeReport} 
                        setActiveReport={setActiveReport}
                        csvData={csvData}
                    />
                    
                    {/* Contenido Principal */}
                    <div className="main-content">
                        <Header />
                        
                        {/* Carga de archivos */}
                        <FileUploadSection 
                            csvData={csvData}
                            handleFileUpload={handleFileUpload}
                            loading={loading}
                        />
                        
                        {/* Mensajes */}
                        {error && <div className="error">{error}</div>}
                        {success && <div className="success">{success}</div>}
                        
                        {/* Contenido basado en datos */}
                        {loading ? (
                            <div className="loading">
                                <i className="fas fa-spinner fa-spin"></i> Cargando y procesando datos...
                            </div>
                        ) : allFilesLoaded ? (
                            <ReportContent 
                                activeReport={activeReport} 
                                data={processedData}
                                csvData={csvData}
                            />
                        ) : (
                            <div className="loading">
                                <i className="fas fa-info-circle"></i> Por favor, carga todos los archivos CSV para ver los reportes
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Componente del Sidebar
        function Sidebar({ activeReport, setActiveReport, csvData }) {
            const reportes = [
                { id: 'resumen', label: 'Resumen General', icon: 'fas fa-chart-pie' },
                { id: 'clientes', label: 'Análisis de Clientes', icon: 'fas fa-users' },
                { id: 'prestamos', label: 'Análisis de Préstamos', icon: 'fas fa-hand-holding-usd' },
                { id: 'sucursales', label: 'Análisis por Sucursal', icon: 'fas fa-building' },
                { id: 'pagos', label: 'Análisis de Pagos', icon: 'fas fa-money-bill-wave' },
                { id: 'morosidad', label: 'Análisis de Morosidad', icon: 'fas fa-exclamation-triangle' }
            ];

            const fileStatus = Object.entries(csvData).map(([file, data]) => ({
                file,
                loaded: data.length > 0,
                count: data.length
            }));

            return (
                <div className="sidebar">
                    <div className="sidebar-header">
                        <h2><i className="fas fa-chart-line"></i> Dashboard Préstamos</h2>
                    </div>
                    
                    <div className="sidebar-section">
                        <h3>Reportes Disponibles</h3>
                        <ul className="sidebar-menu">
                            {reportes.map(reporte => (
                                <li 
                                    key={reporte.id}
                                    className={activeReport === reporte.id ? 'active' : ''}
                                    onClick={() => setActiveReport(reporte.id)}
                                >
                                    <i className={reporte.icon}></i>
                                    {reporte.label}
                                </li>
                            ))}
                        </ul>
                    </div>
                    
                    <div className="sidebar-section">
                        <h3>Estado de Archivos</h3>
                        <ul className="sidebar-menu">
                            {fileStatus.map(({file, loaded, count}) => (
                                <li key={file}>
                                    <i className={loaded ? "fas fa-check-circle" : "fas fa-times-circle"} 
                                       style={{ color: loaded ? '#2ecc71' : '#e74c3c' }}></i>
                                    {file}.csv {loaded && `(${count})`}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        // Componente del Header
        function Header() {
            return (
                <div className="header">
                    <h1>Sistema de Análisis de Préstamos</h1>
                    <div className="user-info">
                        <div className="user-avatar">
                            <span>AD</span>
                        </div>
                        <div className="user-details">
                            <div className="user-name">Administrador</div>
                            <div className="user-role">Sistema CSV</div>
                        </div>
                    </div>
                </div>
            );
        }

        // Componente de Carga de Archivos
        function FileUploadSection({ csvData, handleFileUpload, loading }) {
            const fileInputs = {
                Cliente_est: useRef(null),
                Sucursall: useRef(null),
                Prestamoss: useRef(null),
                Pago: useRef(null)
            };

            return (
                <div className="file-upload-section">
                    <h3><i className="fas fa-upload"></i> Cargar Archivos CSV</h3>
                    <div className="controls">
                        {Object.keys(fileInputs).map(fileType => (
                            <div key={fileType}>
                                <input
                                    type="file"
                                    ref={fileInputs[fileType]}
                                    className="file-input"
                                    accept=".csv"
                                    onChange={(e) => handleFileUpload(e, fileType)}
                                    disabled={loading}
                                />
                                <label 
                                    className="file-label"
                                    onClick={() => !loading && fileInputs[fileType].current.click()}
                                    style={{ 
                                        opacity: loading ? 0.6 : 1,
                                        cursor: loading ? 'not-allowed' : 'pointer'
                                    }}
                                >
                                    <i className="fas fa-upload"></i> {fileType}.csv
                                </label>
                            </div>
                        ))}
                    </div>
                    
                    <div className="file-status">
                        {Object.entries(csvData).map(([file, data]) => (
                            <div 
                                key={file} 
                                className={`file-status-item ${data.length > 0 ? 'uploaded' : ''}`}
                            >
                                <i className={`fas ${data.length > 0 ? 'fa-check' : 'fa-times'}`}></i>
                                <span>{file}.csv: {data.length} registros</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Componente de Contenido del Reporte
        function ReportContent({ activeReport, data, csvData }) {
            switch(activeReport) {
                case 'resumen':
                    return <ResumenReport data={data} csvData={csvData} />;
                case 'clientes':
                    return <ClientesReport data={data} csvData={csvData} />;
                case 'prestamos':
                    return <PrestamosReport data={data} csvData={csvData} />;
                case 'sucursales':
                    return <SucursalesReport data={data} csvData={csvData} />;
                case 'pagos':
                    return <PagosReport data={data} csvData={csvData} />;
                case 'morosidad':
                    return <MorosidadReport data={data} csvData={csvData} />;
                default:
                    return <div>Selecciona un reporte</div>;
            }
        }

        // Componente de Reporte de Resumen
        function ResumenReport({ data, csvData }) {
            return (
                <div>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#3498db' }}>
                                <i className="fas fa-users"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{csvData.Cliente_est.length}</h3>
                                <p>Total Clientes</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#2ecc71' }}>
                                <i className="fas fa-hand-holding-usd"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{csvData.Prestamoss.length}</h3>
                                <p>Total Préstamos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#e74c3c' }}>
                                <i className="fas fa-building"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{csvData.Sucursall.length}</h3>
                                <p>Sucursales</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#f39c12' }}>
                                <i className="fas fa-money-bill-wave"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{csvData.Pago.length}</h3>
                                <p>Pagos Registrados</p>
                            </div>
                        </div>
                    </div>

                    <div className="charts-container">
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Distribución de Préstamos por Tipo</h3>
                            </div>
                            <div className="chart-container">
                                <PrestamosTipoChart data={data} />
                            </div>
                        </div>
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Préstamos por Sucursal</h3>
                            </div>
                            <div className="chart-container">
                                <PrestamosSucursalChart data={data} />
                            </div>
                        </div>
                    </div>

                    <div className="data-container">
                        <div className="data-header">
                            <h3>Resumen de Datos Cargados</h3>
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Archivo</th>
                                    <th>Registros</th>
                                    <th>Campos</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                {Object.entries(csvData).map(([file, data]) => (
                                    <tr key={file}>
                                        <td>{file}.csv</td>
                                        <td>{data.length}</td>
                                        <td>{data.length > 0 ? Object.keys(data[0]).join(', ') : 'N/A'}</td>
                                        <td>
                                            <span style={{ color: data.length > 0 ? '#2ecc71' : '#e74c3c' }}>
                                                {data.length > 0 ? '✓ Cargado' : 'No cargado'}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Componente de Reporte de Clientes
        function ClientesReport({ data, csvData }) {
            return (
                <div>
                    <div className="charts-container">
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Segmentación de Clientes</h3>
                            </div>
                            <div className="chart-container">
                                <ClientesSegmentoChart data={data} />
                            </div>
                        </div>
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Top 10 Clientes por Préstamos</h3>
                            </div>
                            <div className="chart-container">
                                <TopClientesChart data={data} />
                            </div>
                        </div>
                    </div>

                    <div className="data-container">
                        <div className="data-header">
                            <h3>Lista de Clientes</h3>
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Teléfono</th>
                                    <th>Segmento</th>
                                </tr>
                            </thead>
                            <tbody>
                                {csvData.Cliente_est.slice(0, 10).map((cliente, index) => (
                                    <tr key={index}>
                                        <td>{cliente.id_cliente}</td>
                                        <td>{cliente.nombre} {cliente.apellido}</td>
                                        <td>{cliente.email}</td>
                                        <td>{cliente.telefono}</td>
                                        <td>
                                            <span style={{
                                                padding: '4px 8px',
                                                borderRadius: '12px',
                                                fontSize: '0.8rem',
                                                backgroundColor: getSegmentoColor(cliente.segmento_cliente),
                                                color: 'white'
                                            }}>
                                                {cliente.segmento_cliente}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Componente de Reporte de Préstamos
        function PrestamosReport({ data, csvData }) {
            return (
                <div>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#3498db' }}>
                                <i className="fas fa-dollar-sign"></i>
                            </div>
                            <div className="stat-info">
                                <h3>${data.totalMontoPrestamos?.toLocaleString()}</h3>
                                <p>Monto Total Prestado</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#2ecc71' }}>
                                <i className="fas fa-check-circle"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{data.prestamosAprobados}</h3>
                                <p>Préstamos Aprobados</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#e74c3c' }}>
                                <i className="fas fa-clock"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{data.prestamosProceso}</h3>
                                <p>En Proceso</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#f39c12' }}>
                                <i className="fas fa-times-circle"></i>
                            </div>
                            <div className="stat-info">
                                <h3>{data.prestamosRechazados}</h3>
                                <p>Rechazados</p>
                            </div>
                        </div>
                    </div>

                    <div className="charts-container">
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Estado de Préstamos</h3>
                            </div>
                            <div className="chart-container">
                                <PrestamosEstadoChart data={data} />
                            </div>
                        </div>
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Distribución de Montos</h3>
                            </div>
                            <div className="chart-container">
                                <PrestamosMontoChart data={data} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Componentes de Reportes restantes (Sucursales, Pagos, Morosidad)
        function SucursalesReport({ data, csvData }) {
            return (
                <div>
                    <div className="chart-card">
                        <div className="chart-header">

        // Funciones auxiliares
        function processCSVData(csvData) {
            const { Cliente_est, Sucursall, Prestamoss, Pago } = csvData;
            
            if (Cliente_est.length === 0 || Prestamoss.length === 0) {
                return {};
            }

            // Procesar préstamos por tipo
            const prestamosPorTipo = {};
            Prestamoss.forEach(prestamo => {
                const tipo = prestamo.tipo || 'No especificado';
                prestamosPorTipo[tipo] = (prestamosPorTipo[tipo] || 0) + 1;
            });

            // Procesar préstamos por sucursal
            const prestamosPorSucursal = {};
            Prestamoss.forEach(prestamo => {
                const sucursalId = prestamo.id_sucursal;
                const sucursal = Sucursall.find(s => s.id_sucursal === sucursalId);
                const nombreSucursal = sucursal ? sucursal.nombre_sucursal : `Sucursal ${sucursalId}`;
                prestamosPorSucursal[nombreSucursal] = (prestamosPorSucursal[nombreSucursal] || 0) + 1;
            });

            // Procesar clientes por segmento
            const clientesPorSegmento = {};
            Cliente_est.forEach(cliente => {
                const segmento = cliente.segmento_cliente || 'No especificado';
                clientesPorSegmento[segmento] = (clientesPorSegmento[segmento] || 0) + 1;
            });

            // Procesar préstamos por estado
            const prestamosPorEstado = {};
            Prestamoss.forEach(prestamo => {
                const estado = prestamo.estado || 'No especificado';
                prestamosPorEstado[estado] = (prestamosPorEstado[estado] || 0) + 1;
            });

            // Calcular totales
            const totalMontoPrestamos = Prestamoss.reduce((sum, prestamo) => 
                sum + (parseFloat(prestamo.monto) || 0), 0);
                
            const totalPagos = Pago.reduce((sum, pago) => 
                sum + (parseFloat(pago.monto) || 0), 0);

            return {
                prestamosPorTipo,
                prestamosPorSucursal,
                clientesPorSegmento,
                prestamosPorEstado,
                totalMontoPrestamos,
                totalPagos,
                prestamosAprobados: prestamosPorEstado['Aprobado'] || 0,
                prestamosProceso: prestamosPorEstado['En proceso'] || 0,
                prestamosRechazados: prestamosPorEstado['Rechazado'] || 0,
                promedioPagos: Pago.length > 0 ? (totalPagos / Pago.length).toFixed(2) : 0
            };
        }

        function getSegmentoColor(segmento) {
            const colores = {
                'Premium': '#e74c3c',
                'Standard': '#3498db',
                'Básico': '#2ecc71',
                'No especificado': '#95a5a6'
            };
            return colores[segmento] || '#95a5a6';
