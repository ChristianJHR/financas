<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Préstamos - PostgreSQL + React</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
        }
        
        .dashboard {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a2530 100%);
            color: white;
            padding: 20px 0;
            transition: all 0.3s;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 500;
        }
        
        .sidebar-section {
            margin-bottom: 20px;
        }
        
        .sidebar-section h3 {
            padding: 0 20px 10px;
            font-size: 1rem;
            font-weight: 500;
            color: #bdc3c7;
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-menu li {
            padding: 12px 20px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
        }
        
        .sidebar-menu li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-menu li.active {
            background-color: rgba(52, 152, 219, 0.2);
            border-left: 4px solid #3498db;
        }
        
        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        /* Database Connection */
        .db-connection {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .connection-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            color: white;
        }
        
        .stat-info h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .stat-info p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        /* Charts Section */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .chart-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        /* Data Tables */
        .data-container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .data-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .data-table th {
            background-color: #f8f9fa;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .data-table tr:hover {
            background-color: #f8f9fa;
        }
        
        /* Buttons */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #27ae60;
        }
        
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        /* Loading and Errors */
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .error {
            background-color: #ffeaa7;
            color: #d63031;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .sql-query {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .connection-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Simulación de conexión a PostgreSQL
        class PostgreSQLSimulator {
            constructor() {
                this.connected = false;
                this.data = {
                    morosidad: [
                        { cliente: 'Juan Pérez', ciudad: 'Lima', tipo_prestamo: 'Hipotecario', saldo_pendiente: 15000, dias_morosidad: 45 },
                        { cliente: 'María García', ciudad: 'Arequipa', tipo_prestamo: 'Personal', saldo_pendiente: 8500, dias_morosidad: 32 },
                        { cliente: 'Carlos López', ciudad: 'Trujillo', tipo_prestamo: 'Automotriz', saldo_pendiente: 12000, dias_morosidad: 28 }
                    ],
                    prestamos_sucursal: [
                        { nombre_sucursal: 'Central', ciudad: 'Lima', tipo_prestamo: 'Personal', estado: 'Aprobado', cantidad_prestamos: 150, monto_total: 1500000 },
                        { nombre_sucursal: 'Norte', ciudad: 'Trujillo', tipo_prestamo: 'Automotriz', estado: 'En proceso', cantidad_prestamos: 45, monto_total: 675000 },
                        { nombre_sucursal: 'Sur', ciudad: 'Arequipa', tipo_prestamo: 'Hipotecario', estado: 'Aprobado', cantidad_prestamos: 80, monto_total: 2400000 }
                    ],
                    desempeno_clientes: [
                        { cliente: 'Carlos Rodríguez', total_prestamos: 5, monto_total_otorgado: 85000, saldo_total_pendiente: 12500, promedio_dias_mora: 2.3 },
                        { cliente: 'Ana Martínez', total_prestamos: 3, monto_total_otorgado: 45000, saldo_total_pendiente: 5000, promedio_dias_mora: 0.5 },
                        { cliente: 'Luis Hernández', total_prestamos: 7, monto_total_otorgado: 120000, saldo_total_pendiente: 18000, promedio_dias_mora: 5.1 }
                    ],
                    rollup_data: [
                        { ciudad: 'Lima', nombre_sucursal: 'Central', tipo_prestamo: 'Personal', total_prestamos: 150, total_pagado: 1200000, saldo_pendiente: 300000 },
                        { ciudad: 'Lima', nombre_sucursal: 'Central', tipo_prestamo: null, total_prestamos: 280, total_pagado: 2100000, saldo_pendiente: 450000 },
                        { ciudad: 'Lima', nombre_sucursal: null, tipo_prestamo: null, total_prestamos: 450, total_pagado: 3500000, saldo_pendiente: 750000 }
                    ],
                    cube_data: [
                        { ciudad: 'Lima', tipo_prestamo: 'Personal', estado_prestamo: 'Aprobado', monto_total: 1500000 },
                        { ciudad: null, tipo_prestamo: 'Personal', estado_prestamo: 'Aprobado', monto_total: 2800000 },
                        { ciudad: 'Lima', tipo_prestamo: null, estado_prestamo: 'Aprobado', monto_total: 3200000 }
                    ],
                    grouping_sets: [
                        { tipo_prestamo: 'Personal', estado_prestamo: 'Aprobado', nombre_sucursal: null, monto_total: 2800000 },
                        { tipo_prestamo: null, estado_prestamo: null, nombre_sucursal: 'Central', monto_total: 3200000 },
                        { tipo_prestamo: null, estado_prestamo: null, nombre_sucursal: null, monto_total: 8500000 }
                    ]
                };
            }

            async connect(config) {
                // Simular conexión a PostgreSQL
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (config.host && config.database) {
                            this.connected = true;
                            resolve({ success: true, message: 'Conexión exitosa a PostgreSQL' });
                        } else {
                            reject(new Error('Configuración de conexión inválida'));
                        }
                    }, 1000);
                });
            }

            async executeQuery(query) {
                if (!this.connected) {
                    throw new Error('No hay conexión a la base de datos');
                }

                // Simular ejecución de consultas SQL basadas en tu código
                return new Promise((resolve) => {
                    setTimeout(() => {
                        let result = [];
                        
                        if (query.includes('vw_analisis_morosidad')) {
                            result = this.data.morosidad;
                        } else if (query.includes('vw_prestamos_por_sucursal')) {
                            result = this.data.prestamos_sucursal;
                        } else if (query.includes('vw_desempeno_clientes')) {
                            result = this.data.desempeno_clientes;
                        } else if (query.includes('ROLLUP')) {
                            result = this.data.rollup_data;
                        } else if (query.includes('CUBE')) {
                            result = this.data.cube_data;
                        } else if (query.includes('GROUPING SETS')) {
                            result = this.data.grouping_sets;
                        } else if (query.includes('COUNT(*) FROM hechos_prestamos')) {
                            result = [{ count: 1234 }];
                        } else if (query.includes('morosidad_flag = TRUE')) {
                            result = [{ count: 67 }];
                        } else if (query.includes('COUNT(*) FROM pago_temp')) {
                            result = [{ count: 5678 }];
                        }

                        resolve(result);
                    }, 500);
                });
            }

            disconnect() {
                this.connected = false;
            }
        }

        // Componente principal del Dashboard
        function Dashboard() {
            const [activeReport, setActiveReport] = useState('resumen');
            const [dbConnected, setDbConnected] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [reportData, setReportData] = useState({});
            const [dbConfig, setDbConfig] = useState({
                host: 'localhost',
                port: '5432',
                database: 'prestamos_db',
                user: 'postgres',
                password: 'password'
            });

            const db = useRef(new PostgreSQLSimulator());

            // Conectar a la base de datos
            const connectToDatabase = async () => {
                setLoading(true);
                setError(null);
                try {
                    const result = await db.current.connect(dbConfig);
                    setDbConnected(true);
                    setSuccess(result.message);
                    setTimeout(() => setSuccess(null), 3000);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            // Desconectar de la base de datos
            const disconnectFromDatabase = () => {
                db.current.disconnect();
                setDbConnected(false);
                setReportData({});
                setSuccess('Desconectado de la base de datos');
                setTimeout(() => setSuccess(null), 3000);
            };

            // Ejecutar consulta SQL
            const executeSQLQuery = async (query, reportKey) => {
                if (!dbConnected) {
                    setError('Primero debe conectarse a la base de datos');
                    return;
                }

                setLoading(true);
                setError(null);
                try {
                    const result = await db.current.executeQuery(query);
                    setReportData(prev => ({
                        ...prev,
                        [reportKey]: result
                    }));
                } catch (err) {
                    setError(`Error en consulta SQL: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            // Cargar datos cuando cambie el reporte
            useEffect(() => {
                if (dbConnected && activeReport) {
                    loadReportData(activeReport);
                }
            }, [activeReport, dbConnected]);

            const loadReportData = async (reportType) => {
                const queries = {
                    morosidad: "SELECT cliente, ciudad, tipo_prestamo, saldo_pendiente, dias_morosidad FROM vw_analisis_morosidad ORDER BY dias_morosidad DESC LIMIT 10",
                    prestamos_sucursal: "SELECT nombre_sucursal, ciudad, tipo_prestamo, estado, cantidad_prestamos, monto_total FROM vw_prestamos_por_sucursal ORDER BY monto_total DESC",
                    desempeno_clientes: "SELECT cliente, total_prestamos, monto_total_otorgado, saldo_total_pendiente, promedio_dias_mora FROM vw_desempeno_clientes ORDER BY prestamos_morosos DESC, monto_total_otorgado DESC LIMIT 10",
                    rollup: "SELECT ciudad, nombre_sucursal, tipo_prestamo, total_prestamos, total_pagado, saldo_pendiente FROM hechos_prestamos GROUP BY ROLLUP (ciudad, nombre_sucursal, tipo_prestamo) ORDER BY ciudad, nombre_sucursal, tipo_prestamo",
                    cube: "SELECT ciudad, tipo_prestamo, estado_prestamo, monto_total FROM hechos_prestamos GROUP BY CUBE (ciudad, tipo_prestamo, estado_prestamo) ORDER BY ciudad, tipo_prestamo, estado_prestamo",
                    grouping_sets: "SELECT tipo_prestamo, estado_prestamo, nombre_sucursal, monto_total FROM hechos_prestamos GROUP BY GROUPING SETS ((tipo_prestamo, estado_prestamo), (nombre_sucursal), ()) ORDER BY nombre_sucursal, tipo_prestamo, estado_prestamo",
                    resumen: "SELECT COUNT(*) FROM hechos_prestamos"
                };

                if (queries[reportType]) {
                    await executeSQLQuery(queries[reportType], reportType);
                }
            };

            return (
                <div className="dashboard">
                    {/* Sidebar */}
                    <Sidebar 
                        activeReport={activeReport} 
                        setActiveReport={setActiveReport}
                        dbConnected={dbConnected}
                    />
                    
                    {/* Contenido Principal */}
                    <div className="main-content">
                        <Header />
                        
                        {/* Conexión a Base de Datos */}
                        <DatabaseConnection 
                            dbConfig={dbConfig}
                            setDbConfig={setDbConfig}
                            dbConnected={dbConnected}
                            connectToDatabase={connectToDatabase}
                            disconnectFromDatabase={disconnectFromDatabase}
                            loading={loading}
                        />
                        
                        {/* Mensajes */}
                        {error && <div className="error">{error}</div>}
                        {success && <div className="success">{success}</div>}
                        
                        {/* Contenido basado en datos */}
                        {loading ? (
                            <div className="loading">
                                <i className="fas fa-spinner fa-spin"></i> Ejecutando consulta SQL...
                            </div>
                        ) : dbConnected ? (
                            <ReportContent 
                                activeReport={activeReport} 
                                data={reportData}
                                loadReportData={loadReportData}
                            />
                        ) : (
                            <div className="loading">
                                <i className="fas fa-database"></i> Conéctese a la base de datos para ver los reportes
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Componente del Sidebar
        function Sidebar({ activeReport, setActiveReport, dbConnected }) {
            const reportes = [
                { id: 'resumen', label: 'Resumen General', icon: 'fas fa-chart-pie' },
                { id: 'morosidad', label: 'Análisis de Morosidad', icon: 'fas fa-exclamation-triangle' },
                { id: 'prestamos_sucursal', label: 'Préstamos por Sucursal', icon: 'fas fa-building' },
                { id: 'desempeno_clientes', label: 'Desempeño de Clientes', icon: 'fas fa-users' },
                { id: 'rollup', label: 'ROLLUP - Jerarquía', icon: 'fas fa-layer-group' },
                { id: 'cube', label: 'CUBE - Combinaciones', icon: 'fas fa-cubes' },
                { id: 'grouping_sets', label: 'GROUPING SETS', icon: 'fas fa-th' }
            ];

            return (
                <div className="sidebar">
                    <div className="sidebar-header">
                        <h2><i className="fas fa-database"></i> Dashboard PostgreSQL</h2>
                        <div style={{ 
                            marginTop: '10px', 
                            fontSize: '0.8rem',
                            color: dbConnected ? '#2ecc71' : '#e74c3c'
                        }}>
                            <i className={`fas ${dbConnected ? 'fa-check-circle' : 'fa-times-circle'}`}></i>
                            {dbConnected ? ' Conectado' : ' Desconectado'}
                        </div>
                    </div>
                    
                    <div className="sidebar-section">
                        <h3>Consultas SQL Disponibles</h3>
                        <ul className="sidebar-menu">
                            {reportes.map(reporte => (
                                <li 
                                    key={reporte.id}
                                    className={activeReport === reporte.id ? 'active' : ''}
                                    onClick={() => setActiveReport(reporte.id)}
                                >
                                    <i className={reporte.icon}></i>
                                    {reporte.label}
                                </li>
                            ))}
                        </ul>
                    </div>
                    
                    <div className="sidebar-section">
                        <h3>Vistas SQL</h3>
                        <ul className="sidebar-menu">
                            <li><i className="fas fa-eye"></i> vw_analisis_morosidad</li>
                            <li><i className="fas fa-eye"></i> vw_prestamos_por_sucursal</li>
                            <li><i className="fas fa-eye"></i> vw_desempeno_clientes</li>
                        </ul>
                    </div>
                </div>
            );
        }

        // Componente del Header
        function Header() {
            return (
                <div className="header">
                    <h1>Sistema de Préstamos - PostgreSQL</h1>
                    <div className="user-info">
                        <div className="user-avatar">
                            <span>DB</span>
                        </div>
                        <div className="user-details">
                            <div className="user-name">Administrador BD</div>
                            <div className="user-role">PostgreSQL</div>
                        </div>
                    </div>
                </div>
            );
        }

        // Componente de Conexión a Base de Datos
        function DatabaseConnection({ 
            dbConfig, 
            setDbConfig, 
            dbConnected, 
            connectToDatabase, 
            disconnectFromDatabase, 
            loading 
        }) {
            const handleInputChange = (field, value) => {
                setDbConfig(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            return (
                <div className="db-connection">
                    <h3><i className="fas fa-database"></i> Conexión a PostgreSQL</h3>
                    <div className="connection-form">
                        <div className="form-group">
                            <label>Host:</label>
                            <input 
                                type="text" 
                                value={dbConfig.host}
                                onChange={(e) => handleInputChange('host', e.target.value)}
                                disabled={dbConnected}
                            />
                        </div>
                        <div className="form-group">
                            <label>Puerto:</label>
                            <input 
                                type="text" 
                                value={dbConfig.port}
                                onChange={(e) => handleInputChange('port', e.target.value)}
                                disabled={dbConnected}
                            />
                        </div>
                        <div className="form-group">
                            <label>Base de Datos:</label>
                            <input 
                                type="text" 
                                value={dbConfig.database}
                                onChange={(e) => handleInputChange('database', e.target.value)}
                                disabled={dbConnected}
                            />
                        </div>
                        <div className="form-group">
                            <label>Usuario:</label>
                            <input 
                                type="text" 
                                value={dbConfig.user}
                                onChange={(e) => handleInputChange('user', e.target.value)}
                                disabled={dbConnected}
                            />
                        </div>
                        <div className="form-group">
                            <label>Contraseña:</label>
                            <input 
                                type="password" 
                                value={dbConfig.password}
                                onChange={(e) => handleInputChange('password', e.target.value)}
                                disabled={dbConnected}
                            />
                        </div>
                    </div>
                    <div style={{ display: 'flex', gap: '10px' }}>
                        {!dbConnected ? (
                            <button 
                                className="btn-primary" 
                                onClick={connectToDatabase}
                                disabled={loading}
                            >
                                {loading ? 'Conectando...' : 'Conectar a PostgreSQL'}
                            </button>
                        ) : (
                            <button 
                                className="btn-danger" 
                                onClick={disconnectFromDatabase}
                            >
                                Desconectar
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Componente de Contenido del Reporte
        function ReportContent({ activeReport, data, loadReportData }) {
            const currentData = data[activeReport] || [];

            useEffect(() => {
                // Recargar datos cuando se monta el componente
                if (currentData.length === 0) {
                    loadReportData(activeReport);
                }
            }, [activeReport]);

            switch(activeReport) {
                case 'resumen':
                    return <ResumenReport data={currentData} />;
                case 'morosidad':
                    return <MorosidadReport data={currentData} />;
                case 'prestamos_sucursal':
                    return <PrestamosSucursalReport data={currentData} />;
                case 'desempeno_clientes':
                    return <DesempenoClientesReport data={currentData} />;
                case 'rollup':
                    return <RollupReport data={currentData} />;
                case 'cube':
                    return <CubeReport data={currentData} />;
                case 'grouping_sets':
                    return <GroupingSetsReport data={currentData} />;
                default:
                    return <div>Selecciona un reporte</div>;
            }
        }

        // Componentes de Reportes
        function ResumenReport({ data }) {
            return (
                <div>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#3498db' }}>
                                <i className="fas fa-hand-holding-usd"></i>
                            </div>
                            <div className="stat-info">
                                <h3>1,234</h3>
                                <p>Total Préstamos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#2ecc71' }}>
                                <i className="fas fa-users"></i>
                            </div>
                            <div className="stat-info">
                                <h3>567</h3>
                                <p>Clientes Activos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#e74c3c' }}>
                                <i className="fas fa-exclamation-triangle"></i>
                            </div>
                            <div className="stat-info">
                                <h3>67</h3>
                                <p>Préstamos Morosos</p>
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon" style={{ backgroundColor: '#f39c12' }}>
                                <i className="fas fa-building"></i>
                            </div>
                            <div className="stat-info">
                                <h3>5</h3>
                                <p>Sucursales</p>
                            </div>
                        </div>
                    </div>

                    <div className="charts-container">
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Distribución de Préstamos</h3>
                            </div>
                            <div className="chart-container">
                                <ResumenChart />
                            </div>
                        </div>
                        <div className="chart-card">
                            <div className="chart-header">
                                <h3>Estado de Préstamos</h3>
                            </div>
                            <div className="chart-container">
                                <EstadoPrestamosChart />
                            </div>
                        </div>
                    </div>

                    <div className="data-container">
                        <div className="data-header">
                            <h3>Consulta SQL Ejecutada</h3>
                        </div>
                        <div className="sql-query">
                            SELECT COUNT(*) FROM hechos_prestamos;
                        </div>
                    </div>
                </div>
            );
        }

        function MorosidadReport({ data }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>Top 10 Clientes con Mayor Morosidad</h3>
                        </div>
                        <div className="sql-query">
                            SELECT cliente, ciudad, tipo_prestamo, saldo_pendiente, dias_morosidad 
                            FROM vw_analisis_morosidad 
                            ORDER BY dias_morosidad DESC 
                            LIMIT 10
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Ciudad</th>
                                    <th>Tipo Préstamo</th>
                                    <th>Saldo Pendiente</th>
                                    <th>Días Morosidad</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.map((item, index) => (
                                    <tr key={index}>
                                        <td>{item.cliente}</td>
                                        <td>{item.ciudad}</td>
                                        <td>{item.tipo_prestamo}</td>
                                        <td>${item.saldo_pendiente?.toLocaleString()}</td>
                                        <td>
                                            <span style={{
                                                color: item.dias_morosidad > 30 ? '#e74c3c' : '#f39c12',
                                                fontWeight: 'bold'
                                            }}>
                                                {item.dias_morosidad} días
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function PrestamosSucursalReport({ data }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>Préstamos por Sucursal</h3>
                        </div>
                        <div className="sql-query">
                            SELECT nombre_sucursal, ciudad, tipo_prestamo, estado, cantidad_prestamos, monto_total 
                            FROM vw_prestamos_por_sucursal 
                            ORDER BY monto_total DESC
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Sucursal</th>
                                    <th>Ciudad</th>
                                    <th>Tipo Préstamo</th>
                                    <th>Estado</th>
                                    <th>Cantidad</th>
                                    <th>Monto Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.map((item, index) => (
                                    <tr key={index}>
                                        <td>{item.nombre_sucursal}</td>
                                        <td>{item.ciudad}</td>
                                        <td>{item.tipo_prestamo}</td>
                                        <td>
                                            <span style={{
                                                padding: '4px 8px',
                                                borderRadius: '12px',
                                                fontSize: '0.8rem',
                                                backgroundColor: getEstadoColor(item.estado),
                                                color: 'white'
                                            }}>
                                                {item.estado}
                                            </span>
                                        </td>
                                        <td>{item.cantidad_prestamos}</td>
                                        <td>${item.monto_total?.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function DesempenoClientesReport({ data }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>Desempeño de Clientes</h3>
                        </div>
                        <div className="sql-query">
                            SELECT cliente, total_prestamos, monto_total_otorgado, saldo_total_pendiente, promedio_dias_mora 
                            FROM vw_desempeno_clientes 
                            ORDER BY prestamos_morosos DESC, monto_total_otorgado DESC 
                            LIMIT 10
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Total Préstamos</th>
                                    <th>Monto Otorgado</th>
                                    <th>Saldo Pendiente</th>
                                    <th>Promedio Días Mora</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.map((item, index) => (
                                    <tr key={index}>
                                        <td>{item.cliente}</td>
                                        <td>{item.total_prestamos}</td>
                                        <td>${item.monto_total_otorgado?.toLocaleString()}</td>
                                        <td>${item.saldo_total_pendiente?.toLocaleString()}</td>
                                        <td>
                                            <span style={{
                                                color: item.promedio_dias_mora > 5 ? '#e74c3c' : 
                                                       item.promedio_dias_mora > 2 ? '#f39c12' : '#2ecc71',
                                                fontWeight: 'bold'
                                            }}>
                                                {item.promedio_dias_mora} días
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function RollupReport({ data }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>ROLLUP - Jerarquía de Agregación</h3>
                        </div>
                        <div className="sql-query">
                            SELECT ciudad, nombre_sucursal, tipo_prestamo, total_prestamos, total_pagado, saldo_pendiente 
                            FROM hechos_prestamos 
                            GROUP BY ROLLUP (ciudad, nombre_sucursal, tipo_prestamo) 
                            ORDER BY ciudad, nombre_sucursal, tipo_prestamo
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Ciudad</th>
                                    <th>Sucursal</th>
                                    <th>Tipo Préstamo</th>
                                    <th>Total Préstamos</th>
                                    <th>Total Pagado</th>
                                    <th>Saldo Pendiente</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.map((item, index) => (
                                    <tr key={index} style={{
                                        backgroundColor: !item.tipo_prestamo ? '#f8f9fa' : 'transparent',
                                        fontWeight: !item.tipo_prestamo ? 'bold' : 'normal'
                                    }}>
                                        <td>{item.ciudad || 'TOTAL'}</td>
                                        <td>{item.nombre_sucursal || 'SUBTOTAL'}</td>
                                        <td>{item.tipo_prestamo || 'TODOS'}</td>
                                        <td>{item.total_prestamos}</td>
                                        <td>${item.total_pagado?.toLocaleString()}</td>
                                        <td>${item.saldo_pendiente?.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function CubeReport({ data }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>CUBE - Combinaciones Completas</h3>
                        </div>
                        <div className="sql-query">
                            SELECT ciudad, tipo_prestamo, estado_prestamo, monto_total 
                            FROM hechos_prestamos 
                            GROUP BY CUBE (ciudad, tipo_prestamo, estado_prestamo) 
                            ORDER BY ciudad, tipo_prestamo, estado_prestamo
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Ciudad</th>
                                    <th>Tipo Préstamo</th>
                                    <th>Estado</th>
                                    <th>Monto Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.map((item, index) => (
                                    <tr key={index}>
                                        <td>{item.ciudad || 'TODAS'}</td>
                                        <td>{item.tipo_prestamo || 'TODOS'}</td>
                                        <td>{item.estado_prestamo || 'TODOS'}</td>
                                        <td>${item.monto_total?.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function GroupingSetsReport({ data }) {
            return (
                <div>
                    <div className="data-container">
                        <div className="data-header">
                            <h3>GROUPING SETS - Reportes Personalizados</h3>
                        </div>
                        <div className="sql-query">
                            SELECT tipo_prestamo, estado_prestamo, nombre_sucursal, monto_total 
                            FROM hechos_prestamos 
                            GROUP BY GROUPING SETS ((tipo_prestamo, estado_prestamo), (nombre_sucursal), ()) 
                            ORDER BY nombre_sucursal, tipo_prestamo, estado_prestamo
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Tipo Préstamo</th>
                                    <th>Estado</th>
                                    <th>Sucursal</th>
                                    <th>Monto Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.map((item, index) => (
                                    <tr key={index} style={{
                                        backgroundColor: !item.tipo_prestamo && !item.estado_prestamo && !item.nombre_sucursal ? 
                                                       '#e8f5e8' : 'transparent',
                                        fontWeight: !item.tipo_prestamo && !item.estado_prestamo && !item.nombre_sucursal ? 
                                                   'bold' : 'normal'
                                    }}>
                                        <td>{item.tipo_prestamo || 'TODOS'}</td>
                                        <td>{item.estado_prestamo || 'TODOS'}</td>
                                        <td>{item.nombre_sucursal || 'TODAS'}</td>
                                        <td>${item.monto_total?.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Componentes de Gráficos
        function ResumenChart() {
            const chartRef = useRef(null);
            useEffect(() => {
                if (chartRef.current) {
                    new Chart(chartRef.current.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: ['Personal', 'Automotriz', 'Hipotecario'],
                            datasets: [{
                                data: [45, 30, 25],
                                backgroundColor: ['#3498db', '#2ecc71', '#e74c3c']
                            }]
                        }
                    });
                }
            }, []);
            return <canvas ref={chartRef} />;
        }

        function EstadoPrestamosChart() {
            const chartRef = useRef(null);
            useEffect(() => {
                if (chartRef.current) {
                    new Chart(chartRef.current.getContext('2d'), {
                        type: 'pie',
                        data: {
                            labels: ['Aprobado', 'En proceso', 'Rechazado'],
                            datasets: [{
                                data: [60, 25, 15],
                                backgroundColor: ['#2ecc71', '#f39c12', '#e74c3c']
                            }]
                        }
                    });
                }
            }, []);
            return <canvas ref={chartRef} />;
        }

        // Funciones auxiliares
        function getEstadoColor(estado) {
            const colores = {
                'Aprobado': '#2ecc71',
                'En proceso': '#f39c12',
                'Rechazado': '#e74c3c'
            };
            return colores[estado] || '#95a5a6';
        }

        // Renderizar la aplicación
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
