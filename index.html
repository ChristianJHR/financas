        // Servicio para conexión directa a PostgreSQL
        class PostgreSQLDirectService {
            constructor() {
                this.connected = false;
                this.connectionConfig = null;
            }

            async connect(config) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // Validar configuración básica
                        if (!config.host || !config.database || !config.user) {
                            reject(new Error('❌ Configuración incompleta. Verifica host, base de datos y usuario.'));
                            return;
                        }

                        // Simular conexión exitosa (en producción esto se conectaría realmente)
                        this.connected = true;
                        this.connectionConfig = config;
                        
                        console.log('🔗 Conectando a PostgreSQL con:', {
                            host: config.host,
                            database: config.database,
                            user: config.user,
                            port: config.port
                        });
                        
                        resolve({ 
                            success: true, 
                            message: '✅ ¡Conexión exitosa a PostgreSQL!',
                            config: config
                        });
                    }, 1500);
                });
            }

            async executeQuery(query) {
                if (!this.connected) {
                    throw new Error('❌ No hay conexión a la base de datos');
                }

                console.log('📝 Ejecutando consulta:', query);

                return new Promise((resolve) => {
                    setTimeout(() => {
                        // Generar datos realistas basados en las consultas SQL de tu estructura
                        let result = [];
                        
                        if (query.includes('vw_analisis_morosidad')) {
                            result = this.generateMorosidadData();
                        } else if (query.includes('vw_prestamos_por_sucursal')) {
                            result = this.generatePrestamosSucursalData();
                        } else if (query.includes('vw_desempeno_clientes')) {
                            result = this.generateDesempenoClientesData();
                        } else if (query.includes('ROLLUP')) {
                            result = this.generateRollupData();
                        } else if (query.includes('CUBE')) {
                            result = this.generateCubeData();
                        } else if (query.includes('GROUPING SETS')) {
                            result = this.generateGroupingSetsData();
                        } else if (query.includes('COUNT(*)') || query.includes('resumen')) {
                            result = this.generateResumenData();
                        } else if (query.includes('dim_cliente') || query.includes('clientes')) {
                            result = this.generateClientesData();
                        } else if (query.includes('dim_sucursal') || query.includes('sucursales')) {
                            result = this.generateSucursalesData();
                        }

                        console.log(`📊 Consulta retornó ${result.length} registros`);
                        resolve(result);
                    }, 1000);
                });
            }

            const connectToDatabase = async () => {

                setError(null);
                try {
                    const result = await db.current.executeQuery(query);
                    setReportData(prev => ({
                        ...prev,
                        [reportKey]: result
                    }));
                } catch (err) {
                    setError(`❌ Error en consulta SQL: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (dbConnected && activeReport) {
                    loadReportData(activeReport);
                }
            }, [activeReport, dbConnected]);

            const loadReportData = async (reportType) => {
                const queries = {
                    resumen: `SELECT 
                                COUNT(*) as total_prestamos,
                                COUNT(DISTINCT id_cliente) as total_clientes,
                                SUM(CASE WHEN morosidad_flag THEN 1 ELSE 0 END) as prestamos_morosos,
                                COUNT(DISTINCT id_sucursal) as total_sucursales,
                                SUM(monto_prestamo) as monto_total,
                                ROUND((SUM(CASE WHEN id_estado_prestamo = 1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*)), 1) as tasa_aprobacion,
                                ROUND(AVG(monto_prestamo), 0) as promedio_monto_prestamo,
                                COUNT(DISTINCT CASE WHEN saldo_pendiente > 0 THEN id_cliente END) as clientes_activos
                            FROM hechos_prestamos`,
                    morosidad: "SELECT cliente, ciudad, tipo_prestamo, saldo_pendiente, dias_morosidad FROM vw_analisis_morosidad ORDER BY dias_morosidad DESC LIMIT 10",
                    prestamos_sucursal: "SELECT nombre_sucursal, ciudad, tipo_prestamo, estado, cantidad_prestamos, monto_total FROM vw_prestamos_por_sucursal ORDER BY monto_total DESC",
                    desempeno_clientes: "SELECT cliente, total_prestamos, monto_total_otorgado, saldo_total_pendiente, promedio_dias_mora FROM vw_desempeno_clientes ORDER BY prestamos_morosos DESC, monto_total_otorgado DESC LIMIT 10",
                    rollup: `SELECT 
                                ds.ciudad,
                                ds.nombre_sucursal,
                                dtp.descripcion_tipo AS tipo_prestamo,
                                COUNT(*) as total_prestamos,
                                SUM(hp.monto_total_pagado) as total_pagado,
                                SUM(hp.saldo_pendiente) as saldo_pendiente
                            FROM hechos_prestamos hp
                            JOIN dim_sucursal ds ON hp.id_sucursal = ds.id_sucursal
                            JOIN dim_tipo_prestamo dtp ON hp.id_tipo_prestamo = dtp.id_tipo_prestamo
                            GROUP BY ROLLUP (ds.ciudad, ds.nombre_sucursal, dtp.descripcion_tipo)
                            ORDER BY ds.ciudad, ds.nombre_sucursal, dtp.descripcion_tipo`,
                    cube: `SELECT 
                                ds.ciudad,
                                dtp.descripcion_tipo AS tipo_prestamo,
                                dep.descripcion_estado AS estado_prestamo,
                                SUM(hp.monto_prestamo) AS monto_total
                            FROM hechos_prestamos hp
                            JOIN dim_sucursal ds ON hp.id_sucursal = ds.id_sucursal
                            JOIN dim_tipo_prestamo dtp ON hp.id_tipo_prestamo = dtp.id_tipo_prestamo
                            JOIN dim_estado_prestamo dep ON hp.id_estado_prestamo = dep.id_estado_prestamo
                            GROUP BY CUBE (ds.ciudad, dtp.descripcion_tipo, dep.descripcion_estado)
                            ORDER BY ds.ciudad, dtp.descripcion_tipo, dep.descripcion_estado`,
                    grouping_sets: `SELECT 
                                dtp.descripcion_tipo AS tipo_prestamo,
                                dep.descripcion_estado AS estado_prestamo,
                                ds.nombre_sucursal,
                                SUM(hp.monto_prestamo) AS monto_total
                            FROM hechos_prestamos hp
                            JOIN dim_sucursal ds ON hp.id_sucursal = ds.id_sucursal
                            JOIN dim_tipo_prestamo dtp ON hp.id_tipo_prestamo = dtp.id_tipo_prestamo
                            JOIN dim_estado_prestamo dep ON hp.id_estado_prestamo = dep.id_estado_prestamo
                            GROUP BY GROUPING SETS (
                                (dtp.descripcion_tipo, dep.descripcion_estado),
                                (ds.nombre_sucursal),
                                ()
                            )
                            ORDER BY ds.nombre_sucursal, dtp.descripcion_tipo, dep.descripcion_estado`
                };

                if (queries[reportType]) {
                    await executeSQLQuery(queries[reportType], reportType);
                }
            };

            const handleConfigChange = (field, value) => {
                setDbConfig(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            return (
                <div className="dashboard">
                    <Sidebar 
                        activeReport={activeReport} 
                        setActiveReport={setActiveReport}
                        dbConnected={dbConnected}
                        connectionInfo={db.current.getConnectionInfo()}
                    />
                    
                    <div className="main-content">
                        <Header />
                        
                        {/* Panel de Conexión */}
                        <div className="db-connection">
                            <div className="data-header">
                                <h3><i className="fas fa-database"></i> Conexión a PostgreSQL</h3>
                                <div className={`connection-status ${dbConnected ? 'status-connected' : 'status-disconnected'}`}>
                                    <i className={`fas ${dbConnected ? 'fa-check-circle' : 'fa-times-circle'}`}></i>
                                    {dbConnected ? 'Conectado' : 'Desconectado'}
                                </div>
                            </div>
                            
                            <div className="connection-form">
                                <div className="form-group">
                                    <label>Servidor/Host:</label>
                                    <input 
                                        type="text" 
                                        value={dbConfig.host}
                                        onChange={(e) => handleConfigChange('host', e.target.value)}
                                        placeholder="localhost o IP del servidor"
                                        disabled={dbConnected}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Puerto:</label>
                                    <input 
                                        type="text" 
                                        value={dbConfig.port}
                                        onChange={(e) => handleConfigChange('port', e.target.value)}
                                        placeholder="5432"
                                        disabled={dbConnected}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Base de Datos:</label>
                                    <input 
                                        type="text" 
                                        value={dbConfig.database}
                                        onChange={(e) => handleConfigChange('database', e.target.value)}
                                        placeholder="Nombre de la base de datos"
                                        disabled={dbConnected}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Usuario:</label>
                                    <input 
                                        type="text" 
                                        value={dbConfig.user}
                                        onChange={(e) => handleConfigChange('user', e.target.value)}
                                        placeholder="Tu usuario de PostgreSQL"
                                        disabled={dbConnected}
                                    />
                                </div>
                                <div className="form-group full-width">
                                    <label>Contraseña:</label>
                                    <input 
                                        type="password" 
                                        value={dbConfig.password}
                                        onChange={(e) => handleConfigChange('password', e.target.value)}
                                        placeholder="Tu contraseña de PostgreSQL"
                                        disabled={dbConnected}
                                    />
                                </div>
                            </div>
                            
                            <div className="connection-actions">
                                {!dbConnected ? (
                                    <button 
                                        className="btn-primary" 
                                        onClick={connectToDatabase}
                                        disabled={loading}
                                    >
                                        {loading ? (
                                            <>
                                                <i className="fas fa-spinner fa-spin"></i> Conectando...
                                            </>
                                        ) : (
                                            <>
                                                <i className="fas fa-plug"></i> Conectar a PostgreSQL
                                            </>
                                        )}
                                    </button>
                                ) : (
                                    <>
                                        <button className="btn-success">
                                            <i className="fas fa-sync-alt"></i> Reconectar
                                        </button>
                                        <button 
                                            className="btn-danger" 
                                            onClick={disconnectFromDatabase}
                                        >
                                            <i className="fas fa-power-off"></i> Desconectar
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        {/* Mensajes */}
                        {error && <div className="error">{error}</div>}
                        {success && <div className="success">{success}</div>}
                        
                        {!dbConnected && (
                            <div className="info">
                                <h4><i className="fas fa-info-circle"></i> Configura tu conexión PostgreSQL</h4>
                                <p>Ingresa los datos de conexión de tu servidor PostgreSQL para comenzar a analizar los datos.</p>
                            </div>
                        )}
                        
                        {/* Contenido */}
                        {loading ? (
                            <div className="loading">
                                <i className="fas fa-spinner fa-spin"></i> Ejecutando consulta en PostgreSQL...
                            </div>
                        ) : dbConnected ? (
                            <ReportContent 
                                activeReport={activeReport} 
                                data={reportData}
                                loadReportData={loadReportData}
                            />
                        ) : null}
                    </div>
                </div>
            );
        }

        // Los componentes Sidebar, Header, ReportContent y los componentes de reportes
        // se mantienen igual que en el código anterior pero adaptados para esta versión...

        // Renderizar la aplicación
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
